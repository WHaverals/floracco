[project]
name = "floracco"
version = "0.1.0"
description = "Code and workflows for the Florentine Accomandite Project (1445–1808)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pandas",
    "python-dotenv",
    "uvicorn>=0.48.0",
    "xlrd>=2.0.2",
]

# Offline person-linkage work (docs/person_linkage/research.md). Deliberately an
# OPT-IN extra, not a runtime dependency: the deployed image builds with
# `uv sync --frozen`, which does not install extras, so the review server stays
# lean. Use locally with:  uv sync --extra linkage
[project.optional-dependencies]
linkage = [
    "splink>=4.0.16",
    "duckdb>=1.0",
    "altair>=5.0",
    "jupyterlab>=4.0",
]
